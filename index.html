        messageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        scale: <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z M2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z M7 21h10 M12 3v18 M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        fileSpreadsheet: <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7L15 2z M14 2v5h5 M8 13h8 M8 17h8 M10 9h4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        kanban: <path d="M6 5v11 M12 5v6 M18 5v14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        copy: <path d="M8 4v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7.242a2 2 0 0 0-.602-1.43L16.083 2.57A2 2 0 0 0 14.685 2H10a2 2 0 0 0-2 2z M16 18v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        trash: <path d="M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2 M10 11v6 M14 11v6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        plus: <path d="M5 12h14 M12 5v14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        chevronLeft: <path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        chevronRight: <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        externalLink: <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14L21 3" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        check: <path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        clock: <g><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="2"/><path d="M12 6v6l4 2" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></g>
      };
      return (
        <svg viewBox="0 0 24 24" className={className} {...props}>
          {icons[name] || icons.sparkles}
        </svg>
      );
    };

    const copyToClipboard = (text, onComplete) => {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        if (onComplete) onComplete(true);
      } catch (err) {
        console.error("Copy failed", err);
        if (onComplete) onComplete(false);
      }
      document.body.removeChild(textarea);
    };

    const blobToBase64 = (blob) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    };

    function App() {
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const [apiKey, setApiKey] = useState(() => localStorage.getItem('julia_gemini_key') || '');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const saveApiKey = (val) => {
        setApiKey(val);
        localStorage.setItem('julia_gemini_key', val);
        showToast('Gemini API Key 已安全儲存！', 'success');
        setIsSettingsOpen(false);
      };

      // Audio Recorder State
      const [isRecording, setIsRecording] = useState(false);
      const [recordDuration, setRecordDuration] = useState(0);
      const [audioUrl, setAudioUrl] = useState(null);
      const [audioBlob, setAudioBlob] = useState(null);
      const [isTranscribing, setIsTranscribing] = useState(false);
      const mediaRecorderRef = useRef(null);
      const timerRef = useRef(null);
      const audioChunksRef = useRef([]);

      // Calendar State
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDateStr, setSelectedDateStr] = useState(() => new Date().toISOString().split('T')[0]);
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('julia_events');
        return saved ? JSON.parse(saved) : [
          { id: 'e1', date: new Date().toISOString().split('T')[0], title: 'TFDA 檢驗案件審查與報告核發', time: '10:00', category: 'work' },
          { id: 'e2', date: new Date().toISOString().split('T')[0], title: '與誠品選品討論化粧品 PIF 補件', time: '14:30', category: 'work' }
        ];
      });
      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventTime, setNewEventTime] = useState('09:00');

      // Todos State
      const [todos, setTodos] = useState(() => {
        const saved = localStorage.getItem('julia_todos');
        return saved ? JSON.parse(saved) : [
          { id: 't1', title: '核對最新食品重金屬定量分析未稅報價與樣品量', category: 'work', priority: 'high', completed: false, date: new Date().toISOString().split('T')[0] },
          { id: 't2', title: '確認日本/歐洲考察門票與景點行程時間配置', category: 'personal', priority: 'medium', completed: false, date: new Date().toISOString().split('T')[0] },
          { id: 't3', title: '回覆 VIP 客戶 LINE 訊息（帶白話法規說明）', category: 'work', priority: 'high', completed: true, date: new Date().toISOString().split('T')[0] }
        ];
      });
      const [filterTab, setFilterTab] = useState('all');
      const [newTodoText, setNewTodoText] = useState('');
      const [newTodoCategory, setNewTodoCategory] = useState('work');
      const [newTodoPriority, setNewTodoPriority] = useState('medium');

      // Notes State
      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('julia_notes');
        return saved ? JSON.parse(saved) : [
          {
            id: 'note-1',
            title: '📖 Julia 的高效溝通與商務法則',
            content: `# Julia 的思考藍圖\n\n- **溝通態度**：成熟、俐落、具同理心，站在「協助客戶解決問題與保障權益」的視角。\n- **去客套與禁詞**：完全去除多餘套句，【嚴格禁止使用「麻煩」二字】。\n- **報價規範**：參照 Google Drive 官方檢驗價目表。\n- **Obsidian 串接**：點擊右上角「匯出 .md」即可直接備份至個人筆記庫。`,
            updatedAt: new Date().toISOString()
          }
        ];
      });
      const [activeNoteId, setActiveNoteId] = useState(notes[0]?.id || null);
      const [noteMode, setNoteMode] = useState('split');

      // Business Suite Tabs
      const [activeBizTab, setActiveBizTab] = useState('lineDraft');
      const [clientInquiry, setClientInquiry] = useState('');
      const [generatedDraft, setGeneratedDraft] = useState('');
      const [isDrafting, setIsDrafting] = useState(false);

      // Dynamic quotation calculator slots
      const [querySlots, setQuerySlots] = useState([
        { id: 1, name: '農藥殘留 410 項多重殘留分析', priceExTax: 8200, leadTimeDays: 5, sampleQtyText: '300g (乾燥固態)' },
        { id: 2, name: 'ORAC 抗氧化能力檢測 (新增)', priceExTax: 6800, leadTimeDays: 7, sampleQtyText: '100g' },
        { id: 3, name: '重金屬 4 項定量分析', priceExTax: 4500, leadTimeDays: 7, sampleQtyText: '100g' },
        { id: 4, name: '', priceExTax: 0, leadTimeDays: 0, sampleQtyText: '' },
        { id: 5, name: '', priceExTax: 0, leadTimeDays: 0, sampleQtyText: '' }
      ]);

      // CRM Kanban Cases
      const [crmCases, setCrmCases] = useState(() => {
        const saved = localStorage.getItem('julia_crm_cases');
        return saved ? JSON.parse(saved) : [
          { id: 'case-1', clientName: '林董事長', company: '鼎峰科技', status: 'pending_sample', followDate: new Date().toISOString().split('T')[0], notes: '農藥殘留 410 項待補樣 150g，已傳送白話補充說明。' },
          { id: 'case-2', clientName: '張特助', company: '誠品生活選品', status: 'testing_in_lab', followDate: '2026-09-03', notes: '化粧品 PIF 安全評估實驗室檢測中，預計 9/5 出具初稿。' },
          { id: 'case-3', clientName: '高經理', company: '晨曦國際創投', status: 'reviewing_report', followDate: '2026-09-01', notes: '重金屬 4 項與微生物報告核對中，待客戶確認開立發票。' },
          { id: 'case-4', clientName: '王副總', company: '綠原生鮮研發', status: 'closed', followDate: '2026-08-20', notes: '已結案並寄送正式紙本蓋章檢驗報告。' }
        ];
      });
      const [showAddClientModal, setShowAddClientModal] = useState(false);
      const [newCase, setNewCase] = useState({ clientName: '', company: '', status: 'pending_sample', followDate: '', notes: '' });

      useEffect(() => { localStorage.setItem('julia_events', JSON.stringify(events)); }, [events]);
      useEffect(() => { localStorage.setItem('julia_todos', JSON.stringify(todos)); }, [todos]);
      useEffect(() => { localStorage.setItem('julia_notes', JSON.stringify(notes)); }, [notes]);
      useEffect(() => { localStorage.setItem('julia_crm_cases', JSON.stringify(crmCases)); }, [crmCases]);

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream, { mimeType: 'audio/webm' });
          audioChunksRef.current = [];

          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorderRef.current.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            setAudioBlob(blob);
            setAudioUrl(URL.createObjectURL(blob));
            stream.getTracks().forEach(track => track.stop());
            showToast('錄音已完成！點擊即可發送 Gemini API 進行真實轉譯。', 'success');
          };

          mediaRecorderRef.current.start();
          setIsRecording(true);
          setRecordDuration(0);
          timerRef.current = setInterval(() => setRecordDuration(prev => prev + 1), 1000);
        } catch (err) {
          showToast('無法取得麥克風錄音權限。', 'error');
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          clearInterval(timerRef.current);
          setIsRecording(false);
        }
      };

      const handleGeminiAudioTranscribe = async () => {
        if (!apiKey) {
          showToast('請點擊右上角「⚙️ API 設定」輸入您的 Gemini API Key！', 'error');
          setIsSettingsOpen(true);
          return;
        }
        if (!audioBlob) {
          showToast('請先完成錄音再執行轉譯！', 'info');
          return;
        }

        setIsTranscribing(true);

        try {
          const base64Audio = await blobToBase64(audioBlob);
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  {
                    inline_data: {
                      mime_type: 'audio/webm',
                      data: base64Audio
                    }
                  },
                  { text: '請將這段語音精準轉譯為繁體中文逐字稿，並條列出：1. 核心重點 2. 待辦事項 (Markdown 格式)。' }
                ]
              }]
            })
          });

          if (!response.ok) {
            const errJson = await response.json().catch(() => ({}));
            throw new Error(errJson.error?.message || `HTTP 錯誤碼 ${response.status}`);
          }

          const result = await response.json();
          const transcribedText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!transcribedText) throw new Error('模型傳回空白回應。');

          const timestamp = `${new Date().toLocaleDateString('zh-TW')} ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`;
          const newNote = {
            id: `note-${Date.now()}`,
            title: `🎙️ 語音辨識與重點摘要 (${timestamp})`,
            content: transcribedText,
            updatedAt: new Date().toISOString()
          };

          setNotes(prev => [newNote, ...prev]);
          setActiveNoteId(newNote.id);
          showToast('✨ 語音真實轉譯成功！已覆蓋呈現於 Quick Notes。', 'success');

        } catch (err) {
          console.error("Transcribe Error:", err);
          showToast(`轉譯失敗：${err.message}`, 'error');
        } finally {
          setIsTranscribing(false);
        }
      };

      const calendarData = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const days = [];
        for (let i = 0; i < firstDay; i++) days.push({ day: null, dateStr: '' });
        for (let d = 1; d <= totalDays; d++) {
          const mStr = String(month + 1).padStart(2, '0');
          const dStr = String(d).padStart(2, '0');
          days.push({ day: d, dateStr: `${year}-${mStr}-${dStr}` });
        }
        return days;
      }, [currentDate]);

      const selectedDateEvents = useMemo(() => {
        return events.filter(e => e.date === selectedDateStr);
      }, [events, selectedDateStr]);

      const handleAddEvent = (e) => {
        e.preventDefault();
        if (!newEventTitle.trim()) return;
        const item = {
          id: `evt-${Date.now()}`,
          date: selectedDateStr,
          title: newEventTitle.trim(),
          time: newEventTime || '09:00',
          category: 'work'
        };
        setEvents(prev => [...prev, item]);
        setNewEventTitle('');
        showToast(`已新增行程至 ${selectedDateStr}！`, 'success');
      };

      const handleDeleteEvent = (id) => {
        setEvents(prev => prev.filter(e => e.id !== id));
        showToast('行程已刪除。', 'info');
      };

      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!newTodoText.trim()) return;
        setTodos(prev => [{
          id: `t-${Date.now()}`,
          title: newTodoText.trim(),
          category: newTodoCategory,
          priority: newTodoPriority,
          completed: false,
          date: selectedDateStr
        }, ...prev]);
        setNewTodoText('');
        showToast('已新增待辦事項！', 'success');
      };

      const toggleTodo = (id) => setTodos(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      const deleteTodo = (id) => setTodos(prev => prev.filter(t => t.id !== id));

      const filteredTodos = useMemo(() => {
        return todos.filter(t => {
          if (filterTab === 'work') return t.category === 'work';
          if (filterTab === 'personal') return t.category === 'personal';
          return true;
        });
      }, [todos, filterTab]);

      const activeNote = useMemo(() => notes.find(n => n.id === activeNoteId) || notes[0] || null, [notes, activeNoteId]);
      const updateActiveNoteContent = (content) => setNotes(prev => prev.map(n => n.id === activeNoteId ? { ...n, content, updatedAt: new Date().toISOString() } : n));
      const updateActiveNoteTitle = (title) => setNotes(prev => prev.map(n => n.id === activeNoteId ? { ...n, title, updatedAt: new Date().toISOString() } : n));

      const handleCreateNewNote = () => {
        const newNote = { id: `note-${Date.now()}`, title: '未命名手帳思考筆記', content: `# 新思考筆記\n\n- 點擊此處撰寫 Markdown...`, updatedAt: new Date().toISOString() };
        setNotes(prev => [newNote, ...prev]);
        setActiveNoteId(newNote.id);
        showToast('已建立新筆記！', 'success');
      };

      const exportMarkdownFile = () => {
        if (!activeNote) return;
        const blob = new Blob([activeNote.content], { type: 'text/markdown;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

- 【需要確認】：缺失的關鍵資訊。`;

【依據】：
衛福部 TFDA 檢驗機構認證規範。

【需要確認】：
請確認補送樣品的抵達日期，以便保留機台。`;

                      type="date"
                      value={newCase.followDate}
                      onChange={(e) => setNewCase({ ...newCase, followDate: e.target.value })}
                      className="w-full bg-planner-bg border border-planner-cardBorder rounded-xl px-3 py-2 text-planner-textMain focus:outline-none"
                    />
                  </div>
                </div>

                <div className="text-xs">
                  <label className="text-[11px] font-bold text-planner-textMuted block mb-1">案件進度與備忘</label>
                  <textarea
                    rows="2"
                    value={newCase.notes}
                    onChange={(e) => setNewCase({ ...newCase, notes: e.target.value })}
                    placeholder="例：農藥殘留 410 項待補樣 200g..."
                    className="w-full bg-planner-bg border border-planner-cardBorder rounded-xl px-3 py-2 text-planner-textMain focus:outline-none resize-none"
                  />
                </div>

                <div className="pt-2 flex items-center justify-end gap-2">
                  <button type="button" onClick={() => setShowAddClientModal(false)} className="px-4 py-2 rounded-xl bg-planner-bg text-planner-textMuted text-xs font-bold">取消</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold shadow-sm">確認建立案件</button>
                </div>
              </form>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-planner-cardBorder py-4 px-6 text-center text-xs text-planner-textMuted flex flex-col sm:flex-row items-center justify-between gap-2">
            <span>Julia 的思考藍圖 © 2026 ‧ 食品與化粧品檢驗專業工作台</span>
            <span className="text-amber-800 font-bold">專業顧問 ‧ 同理視角 ‧ 嚴格依循官方價目與 TFDA 規範</span>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
